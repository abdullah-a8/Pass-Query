[package]
name = "pq"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Fast fuzzy password search for Proton Pass CLI"
repository = "https://github.com/abdullah-a8/Pass-Query"
license = "MIT"
keywords = ["proton-pass", "password", "cli", "fzf", "clipboard"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1.53.3", features = ["process", "rt-multi-thread", "macros", "io-util", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.103"
futures = "0.3"
indicatif = "0.18.3"
colored = "3.0.0"
sha2 = "0.11.1"
hmac = "0.13"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
